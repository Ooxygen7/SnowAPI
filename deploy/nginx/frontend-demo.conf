# Standalone static SnowAPI / new-api demonstration. No proxy_pass is permitted.
# Layout: /var/www/snowapi-demo/current/snowapi/index.html
# Provision TLS for this dedicated host before publishing it over HTTPS.
server {
    listen 80;
    server_name demo.unsnow.online;
    root /var/www/snowapi-demo/current;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/snowapi-demo/acme;
    }
    location = / { return 302 /snowapi/; }
    location = /snowapi { return 301 /snowapi/; }
    location ~ ^/(?:snowapi/)?(?:api|v1|oauth)(?:/|$) { return 403; }
    location /snowapi/static/ { try_files $uri =404; }
    location = /snowapi/index.html {
        add_header Cache-Control "no-store";
        # Server-level security headers must remain inherited.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'none'; worker-src 'self' blob:; object-src 'none'; frame-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location /snowapi/ { try_files $uri $uri/ /snowapi/index.html; }
    location / { return 404; }
}
