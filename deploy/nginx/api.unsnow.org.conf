map $http_upgrade $snowapi_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name api.unsnow.org;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    client_max_body_size 32m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.unsnow.org;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    client_max_body_size 32m;

    ssl_certificate /etc/letsencrypt/live/api.unsnow.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.unsnow.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /snowapi-theme/monochrome.css {
        alias /var/www/snowapi-theme/monochrome.css;
        default_type text/css;
        add_header Cache-Control "public, max-age=300";
    }

    location = /snowapi-theme/unsnow-favicon.png {
        alias /var/www/snowapi-theme/unsnow-favicon.png;
        default_type image/png;
        add_header Cache-Control "public, max-age=86400, immutable";
    }

    location = /about { return 404; }
    location = /about/ { return 404; }
    location = /docs { return 404; }
    location = /docs/ { return 404; }
    location = /rankings { return 404; }
    location = /rankings/ { return 404; }
    location = /__snowapi_docs_disabled__ { return 404; }
    location = /api/rankings { return 404; }

    location ^~ /static/ {
        root /var/www/snowapi-frontend/assets;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /__snowapi_frontend__/default/index.html {
        internal;
        alias /var/www/snowapi-frontend/current/default/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, max-age=0" always;

        sub_filter_once on;
        sub_filter 'href="/logo.png"' 'href="/snowapi-theme/unsnow-favicon.png?v=20260717-1"';
    }

    location = /__snowapi_frontend__/classic/index.html {
        internal;
        alias /var/www/snowapi-frontend/current/classic/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, max-age=0" always;

        sub_filter_once on;
        sub_filter 'href="/logo.png"' 'href="/snowapi-theme/unsnow-favicon.png?v=20260717-1"';
    }

    location ~ ^/__snowapi_frontend__/(default|classic)/(.+)$ {
        internal;
        alias /var/www/snowapi-frontend/current/$1/$2;
        add_header Cache-Control "public, max-age=300" always;
    }

    location / {
        include /etc/nginx/snippets/snowapi-proxy.conf;
        proxy_set_header X-SnowAPI-Static-Frontend "1";
        proxy_pass http://127.0.0.1:3030;
    }
}
